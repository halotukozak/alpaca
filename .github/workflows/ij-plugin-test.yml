name: IntelliJ Plugin

on:
  pull_request:
    paths:
      - 'ij-plugin/**'
      - '.github/workflows/ij-plugin-test.yml'
  push:
    branches: [ main ]
    paths:
      - 'ij-plugin/**'
      - '.github/workflows/ij-plugin-test.yml'

# CI for the Kotlin IntelliJ plugin under ij-plugin/, kept separate from the Mill-built Scala
# library's own Test workflow since the two projects have nothing in common build-wise.
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ij-plugin
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Cache Mill dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-
      # The plugin's tests drive real grammars exported by the Alpaca repo's own test suite
      # (see MathTest.scala), not fixtures checked into ij-plugin/ itself.
      - name: Export the Alpaca test suite's grammars for the plugin's tests to drive
        working-directory: .
        run: ALPACA_GRAMMAR_EXPORT_DIR=/tmp/alpaca-grammar-export ./mill jvm.test.compile
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: ij-plugin

      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: Test
        run: ./gradlew test
      - name: Kotlin coverage
        run: ./gradlew koverXmlReport
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: halotukozak-com/${{ github.event.repository.name }}
          files: ij-plugin/build/reports/kover/report.xml
          flags: kotlin
          fail_ci_if_error: false
      - name: Build plugin
        run: ./gradlew buildPlugin

  # Structural validation of plugin.xml / the plugin archive, plus the IntelliJ Plugin
  # Verifier against the IDEs the platform recommends. Separate job: it downloads full
  # IDE distributions and has nothing to do with the grammar-export test setup above.
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ij-plugin
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: ij-plugin
          cache-read-only: true
      - name: Verify plugin
        run: ./gradlew verifyPlugin
      - name: Upload verifier report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-report
          path: ij-plugin/build/reports/pluginVerifier
